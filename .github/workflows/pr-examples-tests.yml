name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - vue
          - vitepress
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Component Playground package
        run: bun run build:package
      - name: Pack Component Playground package
        id: package
        uses: tanaabased/actions/npm-pack@v1
      - name: Run Leia-backed example
        uses: tanaabased/actions/run-leia@v1
        env:
          COMPONENT_PLAYGROUND_PACKAGE: ${{ steps.package.outputs.tarball-path }}
        with:
          scenarios: examples/${{ matrix.example }}/README.md
          shell: bash
          retry: 0
          stdin: true
