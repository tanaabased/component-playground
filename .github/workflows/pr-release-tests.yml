name: Release Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read release metadata
        id: release
        run: |
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%B %-d, %Y')" >> "$GITHUB_OUTPUT"
      - name: Prepare release candidate
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ steps.release.outputs.version }}
          release-date: ${{ steps.release.outputs.date }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.version }}
          commands: |
            bun run format:write
            bun run format:check
      - name: Build prepared package and documentation
        run: bun run build
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Test exact packed artifact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: node scripts/test-package-task.js
      - name: Dry-run publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true
