name: Release Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read release metadata
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%B %-d, %Y')" >> "$GITHUB_OUTPUT"
      - name: Prepare release candidate
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ steps.release.outputs.version }}
          release-date: ${{ steps.release.outputs.date }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.version }}
          commands: |
            bun run format:write
            bun run format:check
      - name: Build prepared package
        run: bun run build:package
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Test Vue consumer
        uses: tanaabased/actions/run-leia@v1
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        with:
          scenarios: examples/vue/README.md
          shell: bash
          retry: 0
          stdin: true
      - name: Test VitePress consumer
        uses: tanaabased/actions/run-leia@v1
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        with:
          scenarios: examples/vitepress/README.md
          shell: bash
          retry: 0
          stdin: true
      - name: Dry-run publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true
